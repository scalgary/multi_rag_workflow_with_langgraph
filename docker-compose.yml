services:
  jupyter-dev:
    container_name: multi-rag
    build: .
    platform: linux/amd64
    volumes:
      - .:/workspace
    working_dir: /workspace
    ports:
      - "8888:8888"
    env_file: .env
    command: >
      sh -c "pip install jupyter jupyterlab ipykernel &&
              jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root"

    #http://localhost:8888
    #token in logs